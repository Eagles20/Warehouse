<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="830" viewBox="0 0 1240 830" font-family="Inter,DejaVu Sans,Arial,sans-serif">
<defs><marker id="ah" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#44515f"/></marker></defs>
<rect width="1240" height="830" fill="#fff"/>
<text x="24" y="32" font-size="20" font-weight="700" fill="#1d2733">C3 — Components: Inventory module</text>
<text x="24" y="54" font-size="13" fill="#55616f">How a quantity change stays correct: one service, one transaction (ADR-005)</text>
<rect x="20" y="90" width="230" height="90" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="135.0" y="127.0" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Put Away (F10)</text><text x="135.0" y="152.0" text-anchor="middle" font-size="12" fill="#0b1f33">creates stock</text>
<rect x="270" y="90" width="230" height="90" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="385.0" y="127.0" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Move (F16)</text><text x="385.0" y="152.0" text-anchor="middle" font-size="12" fill="#0b1f33">moves stock</text>
<rect x="520" y="90" width="230" height="90" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="635.0" y="127.0" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Ship (F17)</text><text x="635.0" y="152.0" text-anchor="middle" font-size="12" fill="#0b1f33">reduces stock</text>
<rect x="770" y="90" width="230" height="90" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="885.0" y="127.0" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Count (F20)</text><text x="885.0" y="152.0" text-anchor="middle" font-size="12" fill="#0b1f33">sets counted quantity</text>
<rect x="1010" y="90" width="210" height="90" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="1115.0" y="127.0" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Remove expired (F22)</text><text x="1115.0" y="152.0" text-anchor="middle" font-size="12" fill="#0b1f33">reduces stock</text>
<rect x="330" y="290" width="580" height="170" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="620.0" y="351.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Inventory Service (Feature 9)</text><text x="620.0" y="370.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#0b1f33">[adjust(recordId, delta, reason, source) · create(...)]</text><text x="620.0" y="392.5" text-anchor="middle" font-size="12" fill="#0b1f33">1 lock record and check version · 2 reject a negative quantity · 3 save change and</text><text x="620.0" y="407.5" text-anchor="middle" font-size="12" fill="#0b1f33">change entry · 4 set slot status · 5 commit, or roll back all</text>
<rect x="20" y="320" width="250" height="110" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="145.0" y="359.0" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Slot Service (Feature 2)</text><text x="145.0" y="378.0" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#0b1f33">[setSlotStatus]</text><text x="145.0" y="400.0" text-anchor="middle" font-size="12" fill="#0b1f33">Occupied or Empty</text>
<rect x="970" y="320" width="250" height="110" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="1095.0" y="359.0" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Audit Log</text><text x="1095.0" y="378.0" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#0b1f33">[append only]</text><text x="1095.0" y="400.0" text-anchor="middle" font-size="12" fill="#0b1f33">Who, when, old and new, reason</text>
<rect x="330" y="560" width="280" height="110" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="470.0" y="599.0" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Inventory queries</text><text x="470.0" y="618.0" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#0b1f33">[F13, F14, reserved quantity]</text><text x="470.0" y="640.0" text-anchor="middle" font-size="12" fill="#0b1f33">Read-only queries</text>
<rect x="700" y="580" width="320" height="90" rx="26" ry="14" fill="#438dd5" stroke="#2e6295" stroke-width="2"/><text x="860.0" y="601.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Database</text><text x="860.0" y="620.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[PostgreSQL]</text><text x="860.0" y="642.5" text-anchor="middle" font-size="12" fill="#fff">inventory_record, inventory_change, slot,</text><text x="860.0" y="657.5" text-anchor="middle" font-size="12" fill="#fff">audit_log</text>
