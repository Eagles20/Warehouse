<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="710" viewBox="0 0 1240 710" font-family="Inter,DejaVu Sans,Arial,sans-serif">
<defs><marker id="ah" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#44515f"/></marker></defs>
<rect width="1240" height="710" fill="#fff"/>
<text x="24" y="32" font-size="20" font-weight="700" fill="#1d2733">Dynamic view — Ship a picked store order (Feature 17)</text>
<text x="24" y="54" font-size="13" fill="#55616f">Numbered steps, in time order. If step 4 or 5 fails, the whole shipment is rolled back (ADR-005).</text>
<rect x="20" y="440" width="1200" height="195" rx="6" fill="#f4f6f9" stroke="#8793a1" stroke-width="1.5" stroke-dasharray="7 5"/><text x="32" y="462" font-size="14" font-weight="700" fill="#1d2733">Details of each step</text>
<rect x="20" y="100" width="190" height="90" rx="14" fill="#08427b" stroke="#052e56" stroke-width="2"/><circle cx="115.0" cy="98" r="0" fill="none"/><text x="115.0" y="140.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Shipping Clerk</text><text x="115.0" y="159.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[Person]</text>
<rect x="330" y="100" width="190" height="90" rx="6" fill="#438dd5" stroke="#2e6295" stroke-width="2"/><text x="425.0" y="140.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Web application</text><text x="425.0" y="159.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[React]</text>
<rect x="640" y="100" width="190" height="90" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="735.0" y="140.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Ship module (F17)</text><text x="735.0" y="159.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#0b1f33">[API]</text>
<rect x="1000" y="100" width="210" height="90" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="1105.0" y="140.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Store Order (F12)</text><text x="1105.0" y="159.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#0b1f33">[API]</text>
<rect x="330" y="300" width="190" height="90" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="425.0" y="340.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Store and Route (F5, F7)</text><text x="425.0" y="359.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#0b1f33">[API]</text>
<rect x="640" y="300" width="190" height="90" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="735.0" y="340.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Inventory Service (F9)</text><text x="735.0" y="359.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#0b1f33">[API]</text>
<rect x="1000" y="300" width="210" height="90" rx="26" ry="14" fill="#438dd5" stroke="#2e6295" stroke-width="2"/><text x="1105.0" y="340.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Database</text><text x="1105.0" y="359.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[PostgreSQL]</text>
<text x="40" y="490" font-size="13" fill="#1d2733">1  The clerk checks &quot;wrapped and labeled&quot; and presses Ship. The order must be Picked (FR-002, FR-003).</text>
<text x="40" y="514" font-size="13" fill="#1d2733">3  The store must have an active route with an active driver, or the request is rejected (409).</text>
<text x="40" y="538" font-size="13" fill="#1d2733">4  For each pick line: adjust(minus quantity picked). Short picks ship with the smaller quantity.</text>
<text x="40" y="562" font-size="13" fill="#1d2733">5  The inventory service saves the quantity, the change entry, and the slot status in one transaction.</text>
<text x="40" y="586" font-size="13" fill="#1d2733">6  The order is set to Shipped with the ship date. One audit entry is written for the shipment.</text>
<text x="40" y="610" font-size="13" fill="#1d2733">7  The API answers 201 Created to the web application (a shipment with route, driver, and ship date).</text>
<path d="M210,145 L330,145" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M520,145 L640,145" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M735,190 L735,245 L425,245 L425,300" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M735,190 L735,300" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M830,345 L1000,345" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M830,145 L1000,145" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="226" y="114" width="89" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="270" y="130" text-anchor="middle" font-size="12" fill="#2a3644">1 Press Ship</text>
<rect x="520" y="114" width="121" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="580" y="130" text-anchor="middle" font-size="12" fill="#2a3644">2 POST /shipments</text>
<rect x="504" y="234" width="153" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="580" y="250" text-anchor="middle" font-size="12" fill="#2a3644">3 Get route and driver</text>
<rect x="684" y="234" width="102" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="735" y="250" text-anchor="middle" font-size="12" fill="#2a3644">4 Reduce stock</text>
<rect x="829" y="310" width="172" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="915" y="326" text-anchor="middle" font-size="12" fill="#2a3644">5 Save in one transaction</text>
<rect x="839" y="110" width="153" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="915" y="126" text-anchor="middle" font-size="12" fill="#2a3644">6 Set order to Shipped</text>
<rect x="24" y="660" width="18" height="18" rx="3" fill="#08427b" stroke="#052e56"/><text x="50" y="674" font-size="12" fill="#2a3644">Person</text>
<rect x="103.6" y="660" width="18" height="18" rx="3" fill="#438dd5" stroke="#2e6295"/><text x="129.6" y="674" font-size="12" fill="#2a3644">Container</text>
<rect x="203.0" y="660" width="18" height="18" rx="3" fill="#85bbf0" stroke="#5d82a8"/><text x="229.0" y="674" font-size="12" fill="#2a3644">Component</text>
</svg>