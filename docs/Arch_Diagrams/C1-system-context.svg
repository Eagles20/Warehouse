<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" font-family="Inter,DejaVu Sans,Arial,sans-serif">
<defs><marker id="ah" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#44515f"/></marker></defs>
<rect width="1200" height="830" fill="#fff"/>
<text x="24" y="32" font-size="20" font-weight="700" fill="#1d2733">C1 — System Context: Warehouse</text>
<text x="24" y="54" font-size="13" fill="#55616f">Who uses the Warehouse system and which outside parties it works with</text>
<rect x="30" y="90" width="210" height="120" rx="14" fill="#08427b" stroke="#052e56" stroke-width="2"/><circle cx="135.0" cy="88" r="0" fill="none"/><text x="135.0" y="126.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Inventory Clerk</text><text x="135.0" y="145.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[Person]</text><text x="135.0" y="167.5" text-anchor="middle" font-size="12" fill="#fff">Master data, inventory, supplier</text><text x="135.0" y="182.5" text-anchor="middle" font-size="12" fill="#fff">orders, store orders, counts</text>
<rect x="262" y="90" width="210" height="120" rx="14" fill="#08427b" stroke="#052e56" stroke-width="2"/><circle cx="367.0" cy="88" r="0" fill="none"/><text x="367.0" y="126.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Warehouse Worker</text><text x="367.0" y="145.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[Person]</text><text x="367.0" y="167.5" text-anchor="middle" font-size="12" fill="#fff">Receives, puts away, finds,</text><text x="367.0" y="182.5" text-anchor="middle" font-size="12" fill="#fff">picks, moves, counts stock</text>
<rect x="494" y="90" width="210" height="120" rx="14" fill="#08427b" stroke="#052e56" stroke-width="2"/><circle cx="599.0" cy="88" r="0" fill="none"/><text x="599.0" y="126.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Shipping Clerk</text><text x="599.0" y="145.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[Person]</text><text x="599.0" y="167.5" text-anchor="middle" font-size="12" fill="#fff">Ships picked orders, maintains</text><text x="599.0" y="182.5" text-anchor="middle" font-size="12" fill="#fff">routes</text>
<rect x="726" y="90" width="210" height="120" rx="14" fill="#08427b" stroke="#052e56" stroke-width="2"/><circle cx="831.0" cy="88" r="0" fill="none"/><text x="831.0" y="126.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Driver</text><text x="831.0" y="145.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[Person]</text><text x="831.0" y="167.5" text-anchor="middle" font-size="12" fill="#fff">Delivers orders to stores and</text><text x="831.0" y="182.5" text-anchor="middle" font-size="12" fill="#fff">confirms delivery</text>
<rect x="958" y="90" width="210" height="120" rx="14" fill="#08427b" stroke="#052e56" stroke-width="2"/><circle cx="1063.0" cy="88" r="0" fill="none"/><text x="1063.0" y="126.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Manager</text><text x="1063.0" y="145.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[Person]</text><text x="1063.0" y="167.5" text-anchor="middle" font-size="12" fill="#fff">Employees, exceptions, reports,</text><text x="1063.0" y="182.5" text-anchor="middle" font-size="12" fill="#fff">all features</text>
<rect x="380" y="340" width="440" height="140" rx="6" fill="#1168bd" stroke="#0b4884" stroke-width="2"/><text x="600.0" y="386.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Warehouse System</text><text x="600.0" y="405.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[Software system]</text><text x="600.0" y="427.5" text-anchor="middle" font-size="12" fill="#fff">Manages master data, supplier orders, inventory, store orders,</text><text x="600.0" y="442.5" text-anchor="middle" font-size="12" fill="#fff">shipping, monthly counts, and reports</text>
<rect x="60" y="600" width="280" height="110" rx="6" fill="#8a8f98" stroke="#6b7078" stroke-width="2"/><text x="200.0" y="631.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Supplier</text><text x="200.0" y="650.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[External person]</text><text x="200.0" y="672.5" text-anchor="middle" font-size="12" fill="#fff">Receives supplier orders by fax, phone, or</text><text x="200.0" y="687.5" text-anchor="middle" font-size="12" fill="#fff">e-mail (printed from a PDF)</text>
<rect x="880" y="600" width="280" height="110" rx="6" fill="#8a8f98" stroke="#6b7078" stroke-width="2"/><text x="1020.0" y="631.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Store staff</text><text x="1020.0" y="650.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[External person]</text><text x="1020.0" y="672.5" text-anchor="middle" font-size="12" fill="#fff">Receive deliveries and confirm them with</text><text x="1020.0" y="687.5" text-anchor="middle" font-size="12" fill="#fff">the driver</text>
<rect x="470" y="610" width="260" height="100" rx="6" fill="#8a8f98" stroke="#6b7078" stroke-width="2"/><text x="600.0" y="644.0" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Barcode scanner</text><text x="600.0" y="663.0" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[External device]</text><text x="600.0" y="685.0" text-anchor="middle" font-size="12" fill="#fff">Types UPC and slot codes like a keyboard</text>
<path d="M135,210 L468,340" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M367,210 L534,340" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M599,210 L600,340" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M831,210 L666,340" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M1063,210 L732,340" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M380,410 L200,600" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="6 4"/>
<path d="M820,410 L1020,600" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="6 4"/>
<path d="M600,610 L600,480" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="206" y="238" width="38" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="225" y="254" text-anchor="middle" font-size="12" fill="#2a3644">Uses</text>
<rect x="388" y="238" width="38" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="407" y="254" text-anchor="middle" font-size="12" fill="#2a3644">Uses</text>
<rect x="580" y="238" width="38" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="599" y="254" text-anchor="middle" font-size="12" fill="#2a3644">Uses</text>
<rect x="773" y="238" width="38" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="792" y="254" text-anchor="middle" font-size="12" fill="#2a3644">Uses</text>
<rect x="907" y="231" width="134" height="36" rx="4" fill="#fff" fill-opacity="0.93"/><text x="974" y="247" text-anchor="middle" font-size="12" fill="#2a3644">Uses (all features,</text><text x="974" y="262" text-anchor="middle" font-size="12" fill="#2a3644">reports)</text>
<rect x="158" y="488" width="166" height="36" rx="4" fill="#fff" fill-opacity="0.93"/><text x="241" y="504" text-anchor="middle" font-size="12" fill="#2a3644">Order PDF is printed and</text><text x="241" y="520" text-anchor="middle" font-size="12" fill="#2a3644">sent by the clerk</text>
<rect x="877" y="470" width="166" height="51" rx="4" fill="#fff" fill-opacity="0.93"/><text x="960" y="486" text-anchor="middle" font-size="12" fill="#2a3644">Delivery is confirmed by</text><text x="960" y="500" text-anchor="middle" font-size="12" fill="#2a3644">the store (through the</text><text x="960" y="516" text-anchor="middle" font-size="12" fill="#2a3644">driver)</text>
<rect x="533" y="534" width="134" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="600" y="550" text-anchor="middle" font-size="12" fill="#2a3644">Sends scanned codes</text>
<rect x="24" y="780" width="18" height="18" rx="3" fill="#08427b" stroke="#052e56"/><text x="50" y="794" font-size="12" fill="#2a3644">Person</text>
<rect x="103.6" y="780" width="18" height="18" rx="3" fill="#1168bd" stroke="#0b4884"/><text x="129.6" y="794" font-size="12" fill="#2a3644">Warehouse system</text>
<rect x="249.2" y="780" width="18" height="18" rx="3" fill="#8a8f98" stroke="#6b7078"/><text x="275.2" y="794" font-size="12" fill="#2a3644">External person or device</text>
</svg>