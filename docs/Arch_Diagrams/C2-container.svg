<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" font-family="Inter,DejaVu Sans,Arial,sans-serif">
<defs><marker id="ah" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#44515f"/></marker></defs>
<rect width="1200" height="870" fill="#fff"/>
<text x="24" y="32" font-size="20" font-weight="700" fill="#1d2733">C2 — Containers: Warehouse System</text>
<text x="24" y="54" font-size="13" fill="#55616f">The applications and the database that make up the system (proposed technology, see ADR-002)</text>
<rect x="40" y="80" width="250" height="90" rx="14" fill="#08427b" stroke="#052e56" stroke-width="2"/><circle cx="165.0" cy="78" r="0" fill="none"/><text x="165.0" y="120.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Office staff</text><text x="165.0" y="139.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[Clerks and Manager]</text>
<rect x="490" y="80" width="220" height="90" rx="14" fill="#08427b" stroke="#052e56" stroke-width="2"/><circle cx="600.0" cy="78" r="0" fill="none"/><text x="600.0" y="120.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Floor staff</text><text x="600.0" y="139.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[Warehouse Worker]</text>
<rect x="940" y="80" width="220" height="90" rx="14" fill="#08427b" stroke="#052e56" stroke-width="2"/><circle cx="1050.0" cy="78" r="0" fill="none"/><text x="1050.0" y="120.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Driver</text><text x="1050.0" y="139.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[Person]</text>
<rect x="330" y="270" width="540" height="120" rx="6" fill="#438dd5" stroke="#2e6295" stroke-width="2"/><text x="600.0" y="306.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Web application (single-page app)</text><text x="600.0" y="325.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[React, TypeScript, runs in the browser]</text><text x="600.0" y="347.5" text-anchor="middle" font-size="12" fill="#fff">One app that adapts to office computer, tablet, handheld, and phone screens.</text><text x="600.0" y="362.5" text-anchor="middle" font-size="12" fill="#fff">Scan fields take keyboard-style scanner input.</text>
<rect x="330" y="470" width="540" height="130" rx="6" fill="#438dd5" stroke="#2e6295" stroke-width="2"/><text x="600.0" y="511.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">API application</text><text x="600.0" y="530.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[Java 21, Spring Boot, REST JSON /api/v1]</text><text x="600.0" y="552.5" text-anchor="middle" font-size="12" fill="#fff">Modular monolith with six modules: Master Data, Inbound, Inventory, Outbound,</text><text x="600.0" y="567.5" text-anchor="middle" font-size="12" fill="#fff">Stock Control, Reporting. Checks roles on every call.</text>
<rect x="380" y="670" width="440" height="100" rx="26" ry="14" fill="#438dd5" stroke="#2e6295" stroke-width="2"/><text x="600.0" y="704.0" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Database</text><text x="600.0" y="723.0" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[PostgreSQL]</text><text x="600.0" y="745.0" text-anchor="middle" font-size="12" fill="#fff">All warehouse data, audit log, inventory change entries</text>
<rect x="40" y="480" width="220" height="110" rx="6" fill="#438dd5" stroke="#2e6295" stroke-width="2"/><text x="150.0" y="511.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">PDF generator</text><text x="150.0" y="530.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[Library inside the API]</text><text x="150.0" y="552.5" text-anchor="middle" font-size="12" fill="#fff">Creates the supplier order PDF</text><text x="150.0" y="567.5" text-anchor="middle" font-size="12" fill="#fff">(Feature 11)</text>
<rect x="40" y="660" width="240" height="100" rx="6" fill="#8a8f98" stroke="#6b7078" stroke-width="2"/><text x="160.0" y="694.0" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Supplier</text><text x="160.0" y="713.0" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#fff">[External person]</text><text x="160.0" y="735.0" text-anchor="middle" font-size="12" fill="#fff">Gets the printed order</text>
