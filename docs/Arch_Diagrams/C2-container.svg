<rect x="556" y="200" width="89" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="600" y="216" text-anchor="middle" font-size="12" fill="#2a3644">Uses (HTTPS)</text>
<rect x="880" y="200" width="89" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="924" y="216" text-anchor="middle" font-size="12" fill="#2a3644">Uses (HTTPS)</text>
<rect x="580" y="420" width="159" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="660" y="436" text-anchor="middle" font-size="12" fill="#2a3644">Calls (JSON over HTTPS)</text>
<rect x="630" y="610" width="159" height="51" rx="4" fill="#fff" fill-opacity="0.93"/><text x="710" y="626" text-anchor="middle" font-size="12" fill="#2a3644">Reads and writes (JDBC,</text><text x="710" y="640" text-anchor="middle" font-size="12" fill="#2a3644">one transaction per</text><text x="710" y="656" text-anchor="middle" font-size="12" fill="#2a3644">change)</text>
<rect x="235" y="512" width="121" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="295" y="528" text-anchor="middle" font-size="12" fill="#2a3644">Creates order PDF</text>
<rect x="69" y="607" width="172" height="36" rx="4" fill="#fff" fill-opacity="0.93"/><text x="155" y="623" text-anchor="middle" font-size="12" fill="#2a3644">Clerk prints or faxes the</text><text x="155" y="638" text-anchor="middle" font-size="12" fill="#2a3644">PDF</text>
