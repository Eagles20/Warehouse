<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="830" viewBox="0 0 1240 830" font-family="Inter,DejaVu Sans,Arial,sans-serif">
<defs><marker id="ah" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#44515f"/></marker></defs>
<rect width="1240" height="830" fill="#fff"/>
<text x="24" y="32" font-size="20" font-weight="700" fill="#1d2733">C3 — Components: API application</text>
<text x="24" y="54" font-size="13" fill="#55616f">The six modules of the modular monolith and their main calls (ADR-001, ADR-004)</text>
<rect x="30" y="80" width="1180" height="62" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="620.0" y="114.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Security and common services: sign-in, role check on every request (ADR-006), audit log (ADR-008), error format and version check (ADR-003)</text>
<rect x="30" y="190" width="340" height="140" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="200.0" y="236.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Master Data</text><text x="200.0" y="255.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#0b1f33">[Module]</text><text x="200.0" y="277.5" text-anchor="middle" font-size="12" fill="#0b1f33">Features 1–7: Company, Warehouse and Slot, Item,</text><text x="200.0" y="292.5" text-anchor="middle" font-size="12" fill="#0b1f33">Supplier, Store, Employee, Route</text>
<rect x="450" y="190" width="340" height="140" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="620.0" y="236.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Inventory</text><text x="620.0" y="255.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#0b1f33">[Module]</text><text x="620.0" y="277.5" text-anchor="middle" font-size="12" fill="#0b1f33">Features 9, 13, 14, 16: Inventory Service, Find</text><text x="620.0" y="292.5" text-anchor="middle" font-size="12" fill="#0b1f33">Item, Find Empty Slot, Move</text>
<rect x="870" y="190" width="340" height="140" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="1040.0" y="236.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Outbound</text><text x="1040.0" y="255.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#0b1f33">[Module]</text><text x="1040.0" y="277.5" text-anchor="middle" font-size="12" fill="#0b1f33">Features 12, 15, 17, 18: Store Orders, Pick, Ship,</text><text x="1040.0" y="292.5" text-anchor="middle" font-size="12" fill="#0b1f33">Deliver</text>
<rect x="30" y="410" width="340" height="140" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="200.0" y="456.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Inbound</text><text x="200.0" y="475.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#0b1f33">[Module]</text><text x="200.0" y="497.5" text-anchor="middle" font-size="12" fill="#0b1f33">Features 8, 10, 11: Create Supplier Orders,</text><text x="200.0" y="512.5" text-anchor="middle" font-size="12" fill="#0b1f33">Receive, Put Away</text>
<rect x="450" y="410" width="340" height="140" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="620.0" y="456.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Reporting</text><text x="620.0" y="475.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#0b1f33">[Module]</text><text x="620.0" y="497.5" text-anchor="middle" font-size="12" fill="#0b1f33">Feature 23: four read-only reports on stock and</text><text x="620.0" y="512.5" text-anchor="middle" font-size="12" fill="#0b1f33">deliveries (ADR-010)</text>
<rect x="870" y="410" width="340" height="140" rx="6" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/><text x="1040.0" y="456.5" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#0b1f33">Stock Control</text><text x="1040.0" y="475.5" text-anchor="middle" font-size="12" font-weight="400" font-style="italic" fill="#0b1f33">[Module]</text><text x="1040.0" y="497.5" text-anchor="middle" font-size="12" fill="#0b1f33">Features 19–22: Count, Expiration Check, Removal,</text><text x="1040.0" y="512.5" text-anchor="middle" font-size="12" fill="#0b1f33">and the monthly tasks (ADR-009)</text>
<rect x="30" y="640" width="1180" height="80" rx="26" ry="14" fill="#438dd5" stroke="#2e6295" stroke-width="2"/><text x="620.0" y="672.0" text-anchor="middle" font-size="15" font-weight="700" font-style="normal" fill="#fff">Database (PostgreSQL)</text><text x="620.0" y="697.0" text-anchor="middle" font-size="12" fill="#fff">Each module reads and writes only its own tables. Other data is reached through the owner&#x27;s service (ADR-004).</text>
<path d="M450,225 L370,225" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M200,410 L200,330" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M370,480 L410,480 L410,302 L450,302" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M870,239 L790,239" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M870,480 L830,480 L830,302 L790,302" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M620,410 L620,330" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M620,550 L502,640" fill="none" stroke="#44515f" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="334" y="198" width="153" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="410" y="214" text-anchor="middle" font-size="12" fill="#2a3644">slot status, item data</text>
<rect x="180" y="352" width="159" height="36" rx="4" fill="#fff" fill-opacity="0.93"/><text x="260" y="368" text-anchor="middle" font-size="12" fill="#2a3644">reads items, suppliers,</text><text x="260" y="383" text-anchor="middle" font-size="12" fill="#2a3644">slots</text>
<rect x="337" y="420" width="146" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="410" y="436" text-anchor="middle" font-size="12" fill="#2a3644">adjust / create stock</text>
<rect x="741" y="205" width="178" height="36" rx="4" fill="#fff" fill-opacity="0.93"/><text x="830" y="221" text-anchor="middle" font-size="12" fill="#2a3644">reserve stock, then reduce</text><text x="830" y="236" text-anchor="middle" font-size="12" fill="#2a3644">it</text>
<rect x="747" y="413" width="166" height="36" rx="4" fill="#fff" fill-opacity="0.93"/><text x="830" y="429" text-anchor="middle" font-size="12" fill="#2a3644">adjust stock on close or</text><text x="830" y="444" text-anchor="middle" font-size="12" fill="#2a3644">removal</text>
<rect x="624" y="360" width="82" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="665" y="376" text-anchor="middle" font-size="12" fill="#2a3644">reads stock</text>
<rect x="545" y="584" width="153" height="21" rx="4" fill="#fff" fill-opacity="0.93"/><text x="621" y="600" text-anchor="middle" font-size="12" fill="#2a3644">reads (read-only user)</text>
<rect x="24" y="780" width="18" height="18" rx="3" fill="#85bbf0" stroke="#5d82a8"/><text x="50" y="794" font-size="12" fill="#2a3644">Module</text>
<rect x="103.6" y="780" width="18" height="18" rx="3" fill="#438dd5" stroke="#2e6295"/><text x="129.6" y="794" font-size="12" fill="#2a3644">Database</text>
</svg>